<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c11" />
    <title>Media Shelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Surfaces */
        --void: #06070a;
        --bg-main: #0a0c11;
        --bg-sidebar: #0b0d13;
        --bg-card: #12151c;
        --bg-card-hover: #171b24;
        --bg-chip: rgba(255, 255, 255, 0.05);
        --bg-hover: rgba(139, 92, 246, 0.12);
        --bg-glass: rgba(10, 12, 17, 0.78);

        /* Borders */
        --border-main: rgba(255, 255, 255, 0.08);
        --border-soft: rgba(255, 255, 255, 0.05);
        --border-chip: rgba(255, 255, 255, 0.09);
        --border-hover: rgba(139, 92, 246, 0.55);

        /* Accent */
        --accent: #8b5cf6;
        --accent-2: #c4b5fd;
        --accent-glow: rgba(139, 92, 246, 0.45);
        --accent-dim: rgba(139, 92, 246, 0.14);

        /* Text */
        --text-main: #f4f5f8;
        --text-white: #ffffff;
        --text-secondary: #939aa6;
        --text-muted: #b3bac4;
        --text-chip: #c8cdd4;
        --text-tag: #c8cdd4;
        --text-faint: #5b6270;

        --overlay: rgba(4, 5, 8, 0.82);

        /* Scale */
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 18px;
        --r-xl: 22px;
        --r-pill: 999px;

        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-lift: 0 20px 40px -14px rgba(0, 0, 0, 0.55);
        --shadow-glow:
          0 0 0 1px var(--border-hover), 0 12px 32px -8px var(--accent-glow);

        --ease: cubic-bezier(0.16, 1, 0.3, 1);

        --font-display: "Bricolage Grotesque", Inter, system-ui, sans-serif;
        --font-body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;

        /* Responsive tokens */
        --header-h: clamp(60px, 8vw, 76px);
        --sidebar-w: 268px;
        --content-max: 2040px;
        --tap-min: 44px;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      }
      html,
      body {
        overflow-x: hidden;
      }
      body {
        margin: 0;
        background: var(--bg-main);
        color: var(--text-main);
        font-family: var(--font-body);
        position: relative;
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            560px 380px at 14% -6%,
            rgba(139, 92, 246, 0.16),
            transparent 65%
          ),
          radial-gradient(
            680px 460px at 100% 12%,
            rgba(88, 101, 242, 0.08),
            transparent 60%
          ),
          radial-gradient(
            600px 500px at 50% 115%,
            rgba(139, 92, 246, 0.08),
            transparent 60%
          );
      }
      button,
      input,
      select {
        font-family: inherit;
      }
      button {
        -webkit-tap-highlight-color: transparent;
      }
      *:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
        border-radius: 6px;
      }
      img {
        max-width: 100%;
      }

      header {
        height: var(--header-h);
        border-bottom: 1px solid var(--border-main);
        display: flex;
        align-items: center;
        gap: clamp(10px, 2vw, 22px);
        padding: 0 clamp(14px, 3.4vw, 28px);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        background: var(--bg-glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 30;
      }
      header::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent-glow) 30%,
          var(--accent-glow) 70%,
          transparent
        );
        opacity: 0.55;
      }
      .brand {
        font-family: var(--font-display);
        font-size: clamp(16px, 3.6vw, 21px);
        font-weight: 700;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 9px;
        letter-spacing: -0.01em;
        flex-shrink: 0;
      }
      .brand-mark {
        display: inline-flex;
        color: var(--accent-2);
        filter: drop-shadow(0 0 10px var(--accent-glow));
        flex-shrink: 0;
      }
      .brand-accent {
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .brand-word-full {
        display: inline;
      }
      .search {
        flex: 1;
        min-width: 0;
        max-width: 650px;
        position: relative;
      }
      .search:focus-within .search-icon {
        color: var(--accent-2);
      }
      .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        display: flex;
        pointer-events: none;
        transition: color 0.18s var(--ease);
      }
      .search input {
        width: 100%;
        height: 44px;
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        border-radius: var(--r-pill);
        color: var(--text-white);
        padding: 0 16px 0 44px;
        outline: none;
        font-size: 14px;
        transition:
          border-color 0.18s var(--ease),
          box-shadow 0.18s var(--ease),
          background 0.18s var(--ease);
      }
      .search input::placeholder {
        color: var(--text-faint);
      }
      .search input:focus {
        border-color: var(--border-hover);
        background: var(--bg-card-hover);
        box-shadow: 0 0 0 4px var(--accent-dim);
      }
      .count {
        color: var(--text-secondary);
        font-size: 12.5px;
        font-family: var(--font-mono);
        white-space: nowrap;
        background: var(--bg-chip);
        border: 1px solid var(--border-soft);
        padding: 7px 12px;
        border-radius: var(--r-pill);
        flex-shrink: 0;
      }

      main {
        display: block;
        margin-top: var(--header-h);
        min-height: calc(100vh - var(--header-h));
      }
      aside {
        border-right: 1px solid var(--border-main);
        padding: 26px 20px;
        background: var(--bg-sidebar);
        position: fixed;
        top: var(--header-h);
        left: 0;
        width: var(--sidebar-w);
        height: calc(100vh - var(--header-h));
        overflow-y: auto;
        z-index: 20;
      }
      .filter-toggle {
        display: none;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        color: var(--text-white);
        border-radius: var(--r-md);
        padding: 12px 14px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        min-height: var(--tap-min);
        transition:
          border-color 0.18s var(--ease),
          background 0.18s var(--ease);
      }
      .filter-toggle:hover {
        border-color: var(--border-hover);
      }
      .filter-toggle-left {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .filter-badge {
        display: none;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: var(--r-pill);
        background: linear-gradient(135deg, var(--accent), #6d43e0);
        color: var(--text-white);
        font-size: 11px;
        font-weight: 700;
        font-family: var(--font-mono);
      }
      .filter-toggle-chevron {
        display: inline-flex;
        transition: transform 0.22s var(--ease);
        color: var(--text-secondary);
        flex-shrink: 0;
      }
      .filter-toggle.open .filter-toggle-chevron {
        transform: rotate(180deg);
      }
      .filter-group {
        margin-bottom: 28px;
      }
      .filter-title {
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--text-secondary);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
      }
      .filter-title svg {
        opacity: 0.75;
      }
      .select-wrap {
        position: relative;
      }
      .select-wrap::after {
        content: "";
        position: absolute;
        right: 13px;
        top: 50%;
        width: 8px;
        height: 8px;
        border-right: 1.6px solid var(--text-secondary);
        border-bottom: 1.6px solid var(--text-secondary);
        transform: translateY(-65%) rotate(45deg);
        pointer-events: none;
      }
      select {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        border-radius: var(--r-md);
        color: var(--text-white);
        padding: 11px 34px 11px 13px;
        outline: none;
        font-size: 13.5px;
        cursor: pointer;
        min-height: var(--tap-min);
        transition:
          border-color 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      select:hover {
        border-color: var(--border-hover);
      }
      select:focus {
        border-color: var(--border-hover);
        box-shadow: 0 0 0 4px var(--accent-dim);
      }
      .tag-cloud {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .tag-btn {
        border: 1px solid var(--border-main);
        background: var(--bg-card);
        color: var(--text-tag);
        border-radius: var(--r-pill);
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        min-height: 34px;
        overflow-wrap: anywhere;
        transition:
          border-color 0.16s var(--ease),
          color 0.16s var(--ease),
          background 0.16s var(--ease),
          transform 0.16s var(--ease);
      }
      .tag-btn:hover {
        border-color: var(--border-hover);
        color: var(--text-white);
        background: var(--bg-hover);
        transform: translateY(-1px);
      }
      .tag-btn.active {
        border-color: transparent;
        color: var(--text-white);
        background: linear-gradient(135deg, var(--accent), #6d43e0);
        box-shadow: 0 4px 14px -4px var(--accent-glow);
      }
      .clear {
        width: 100%;
        border: 1px solid var(--border-main);
        background: transparent;
        color: var(--text-secondary);
        border-radius: var(--r-md);
        padding: 10px;
        cursor: pointer;
        font-size: 13px;
        min-height: var(--tap-min);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        transition:
          color 0.16s var(--ease),
          border-color 0.16s var(--ease),
          background 0.16s var(--ease);
      }
      .clear:hover {
        color: var(--text-white);
        border-color: var(--border-hover);
        background: var(--bg-hover);
      }

      .content {
        padding: 28px clamp(16px, 3vw, 30px) 40px;
        margin-left: var(--sidebar-w);
        margin-right: auto;
        max-width: var(--content-max);
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 24px;
      }
      .toolbar h1 {
        font-family: var(--font-display);
        font-size: clamp(20px, 2.4vw, 25px);
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.015em;
      }
      .sort-wrap {
        width: 170px;
        flex-shrink: 0;
      }
      .sort-wrap select {
        font-size: 13px;
        padding: 9px 32px 9px 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(192px, 1fr));
        gap: clamp(14px, 1.8vw, 22px);
      }
      .card {
        background: linear-gradient(
          165deg,
          var(--bg-card),
          var(--bg-card-hover) 130%
        );
        border: 1px solid var(--border-main);
        border-radius: var(--r-lg);
        overflow: hidden;
        cursor: pointer;
        box-shadow: var(--shadow-card);
        transition:
          transform 0.24s var(--ease),
          border-color 0.24s var(--ease),
          box-shadow 0.24s var(--ease);
        animation: cardIn 0.4s var(--ease) both;
      }
      @media (hover: hover) and (pointer: fine) {
        .card:hover {
          transform: translateY(-5px);
          border-color: var(--border-hover);
          box-shadow: var(--shadow-lift), var(--shadow-glow);
        }
        .card:hover .poster img {
          transform: scale(1.06);
        }
        .card:hover .poster-overlay {
          opacity: 1;
        }
      }
      .card:active {
        transform: translateY(-1px) scale(0.995);
      }
      .card:focus-visible {
        border-color: var(--border-hover);
        box-shadow: var(--shadow-lift), var(--shadow-glow);
      }
      .poster {
        width: 100%;
        aspect-ratio: 2/3;
        background: #171b22;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #5c6572;
        overflow: hidden;
        position: relative;
      }
      .poster.has-image:not(.loaded) {
        background: linear-gradient(110deg, #12151c 30%, #1c2130 50%, #12151c 70%);
        background-size: 220% 100%;
        animation: shimmer 1.6s linear infinite;
      }
      .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition:
          opacity 0.35s var(--ease),
          transform 0.5s var(--ease);
      }
      .poster img.loaded {
        opacity: 1;
      }
      .poster-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(6, 7, 10, 0.92) 0%,
          rgba(6, 7, 10, 0.15) 55%,
          transparent 80%
        );
        display: flex;
        align-items: flex-end;
        padding: 14px;
        opacity: 0;
        transition: opacity 0.24s var(--ease);
      }
      @media (hover: none) {
        .poster-overlay {
          opacity: 1;
          background: linear-gradient(
            to top,
            rgba(6, 7, 10, 0.85) 0%,
            rgba(6, 7, 10, 0.05) 60%,
            transparent 85%
          );
        }
      }
      .poster-view {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-white);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(6px);
        padding: 6px 10px;
        border-radius: var(--r-pill);
      }
      .placeholder {
        font-size: 12px;
        padding: 20px;
        text-align: center;
        line-height: 1.5;
      }
      .card-body {
        padding: 14px 14px 16px;
      }
      .title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }
      .meta {
        color: var(--text-secondary);
        font-size: 12px;
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 14px;
      }
      .meta-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent-2);
        flex-shrink: 0;
        box-shadow: 0 0 6px var(--accent-glow);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 11px;
      }
      .chip {
        font-size: 10.5px;
        color: var(--text-chip);
        background: var(--bg-chip);
        border: 1px solid var(--border-soft);
        border-radius: var(--r-pill);
        padding: 4px 8px;
        overflow-wrap: anywhere;
      }

      .empty {
        padding: clamp(50px, 10vw, 90px) 20px;
        text-align: center;
        color: var(--text-secondary);
      }
      .empty-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 18px;
        width: 56px;
        height: 56px;
        border-radius: var(--r-lg);
        background: var(--bg-chip);
        border: 1px solid var(--border-main);
        color: var(--text-faint);
      }
      .empty strong {
        display: block;
        color: var(--text-white);
        font-family: var(--font-display);
        font-size: 18px;
        margin-bottom: 7px;
      }
      .empty span {
        font-size: 13.5px;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes overlayIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes shimmer {
        from {
          background-position: 180% 0;
        }
        to {
          background-position: -20% 0;
        }
      }

      .modal {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 25px;
        z-index: 50;
      }
      .modal.open {
        display: flex;
        animation: overlayIn 0.2s var(--ease) both;
      }
      .modal-box {
        width: min(1001px, 100%);
        max-height: 90vh;
        overflow: auto;
        overflow-x: hidden;
        background: linear-gradient(
          165deg,
          var(--bg-card),
          var(--bg-card-hover) 140%
        );
        border: 1px solid var(--border-main);
        border-radius: var(--r-xl);
        display: grid;
        grid-template-columns: 280px 1fr;
        box-shadow:
          0 30px 70px -20px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.04);
        animation: modalIn 0.3s var(--ease) both;
      }
      .modal-poster {
        background: var(--void);
        min-height: 420px;
        position: relative;
      }
      .modal-poster.has-image:not(.loaded) {
        background: linear-gradient(110deg, var(--void) 30%, #171b26 50%, var(--void) 70%);
        background-size: 220% 100%;
        animation: shimmer 1.6s linear infinite;
      }
      .modal-poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.35s var(--ease);
      }
      .modal-poster img.loaded {
        opacity: 1;
      }
      .modal-poster::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.35),
          transparent 40%
        );
        pointer-events: none;
      }
      .modal-info {
        padding: 30px 32px 34px;
        min-width: 0;
      }
      .modal-info h2 {
        font-family: var(--font-display);
        margin: 0 40px 8px 0;
        font-size: clamp(22px, 3.4vw, 29px);
        font-weight: 700;
        letter-spacing: -0.015em;
        overflow-wrap: break-word;
      }
      .modal-description {
        color: var(--text-muted);
        line-height: 1.65;
        font-size: 14.5px;
        overflow-wrap: break-word;
      }
      .close {
        position: fixed;
        right: clamp(14px, 3vw, 25px);
        top: clamp(12px, 2.6vw, 20px);
        border: 1px solid var(--border-main);
        background: var(--bg-glass);
        backdrop-filter: blur(8px);
        color: var(--text-white);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 55;
        transition:
          border-color 0.2s var(--ease),
          transform 0.2s var(--ease),
          background 0.2s var(--ease);
      }
      .close:hover {
        border-color: var(--border-hover);
        background: var(--bg-hover);
        transform: rotate(90deg);
      }
      .detail-section {
        margin-top: 22px;
      }
      .detail-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--text-secondary);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
      }
      .detail-label svg {
        opacity: 0.8;
      }
      .detail-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .detail-chip {
        color: var(--text-chip);
        background: var(--bg-chip);
        border: 1px solid var(--border-chip);
        padding: 8px 12px;
        border-radius: var(--r-pill);
        font-size: 12px;
        cursor: pointer;
        min-height: 34px;
        max-width: 100%;
        overflow-wrap: anywhere;
        transition:
          border-color 0.16s var(--ease),
          color 0.16s var(--ease),
          background 0.16s var(--ease),
          transform 0.16s var(--ease);
      }
      .detail-chip:hover {
        border-color: var(--border-hover);
        color: var(--text-white);
        background: var(--bg-hover);
        transform: translateY(-1px);
      }
      .filename {
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--text-chip);
        background: var(--bg-sidebar);
        border: 1px solid var(--border-main);
        padding: 10px 12px;
        border-radius: var(--r-sm);
        word-break: break-all;
      }

      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 28px;
        flex-wrap: wrap;
      }
      .page-btn {
        border: 1px solid var(--border-main);
        background: var(--bg-card);
        color: var(--text-tag);
        border-radius: var(--r-md);
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
        min-width: 40px;
        min-height: 40px;
        text-align: center;
        transition:
          border-color 0.16s var(--ease),
          color 0.16s var(--ease),
          background 0.16s var(--ease);
      }
      .page-btn:hover:not(:disabled) {
        border-color: var(--border-hover);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .page-btn.active {
        border-color: transparent;
        color: var(--text-white);
        background: linear-gradient(135deg, var(--accent), #6d43e0);
        box-shadow: 0 4px 14px -4px var(--accent-glow);
      }
      .page-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .page-info {
        color: var(--text-secondary);
        font-size: 12.5px;
        font-family: var(--font-mono);
        white-space: nowrap;
        margin-left: 4px;
      }

      /* ============ Laptop / small desktop ============ */
      @media (max-width: 1440px) {
        :root {
          --sidebar-w: 250px;
        }
      }

      /* ============ Tablet (side-by-side, condensed) ============ */
      @media (max-width: 1024px) {
        :root {
          --sidebar-w: 224px;
        }
        aside {
          padding: 22px 16px;
        }
        .filter-group {
          margin-bottom: 22px;
        }
        .grid {
          grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        }
        .content {
          padding: 24px 20px 36px;
        }
      }
      @media (min-width: 769px) and (max-width: 1024px) {
        #filterPanelBody .filter-group {
          margin-bottom: 18px;
        }
      }

      /* ============ Small tablet & below: drawer layout ============ */
      @media (max-width: 768px) {
        header {
          gap: 10px;
        }
        .count {
          display: none;
        }
        main {
          margin-top: var(--header-h);
        }
        aside {
          position: static;
          top: auto;
          left: auto;
          width: auto;
          height: auto;
          z-index: auto;
          border-right: 0;
          border-bottom: 1px solid var(--border-main);
          max-height: none;
          padding: 16px;
        }
        .filter-toggle {
          display: flex;
        }
        #filterPanelBody {
          display: none;
          margin-top: 14px;
        }
        #filterPanelBody.open {
          display: block;
          animation: overlayIn 0.18s var(--ease) both;
        }
        .filter-badge {
          display: inline-flex;
        }
        .toolbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .sort-wrap {
          width: 100%;
        }
        .content {
          padding: 18px 16px 32px;
          margin-left: 0;
          max-width: none;
        }
        .grid {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 14px;
        }
      }

      /* ============ Modal: stack on small viewports ============ */
      @media (max-width: 680px) {
        .modal {
          padding: 0;
          align-items: flex-end;
        }
        .modal-box {
          grid-template-columns: 1fr;
          width: 100%;
          max-height: 94vh;
          border-radius: var(--r-xl) var(--r-xl) 0 0;
        }
        .modal-poster {
          height: 46vh;
          min-height: 240px;
          max-height: 340px;
        }
        .modal-info {
          padding: 24px 20px 30px;
        }
        .modal-info h2 {
          margin-right: 34px;
        }
      }

      /* ============ Mobile phones ============ */
      @media (max-width: 600px) {
        header {
          padding: 0 14px;
        }
        .brand {
          gap: 7px;
        }
        .search input {
          height: 42px;
          font-size: 16px;
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .card-body {
          padding: 11px 11px 13px;
        }
        .title {
          font-size: 14px;
        }
        .meta {
          font-size: 11px;
        }
        .chip {
          font-size: 10px;
          padding: 3px 7px;
        }
        .toolbar h1 {
          font-size: 20px;
        }
        .empty {
          padding: 56px 16px;
        }
      }

      /* ============ Very small mobile ============ */
      @media (max-width: 400px) {
        header {
          padding: 0 12px;
          gap: 8px;
        }
        .brand {
          font-size: 15px;
        }
        .brand-mark svg {
          width: 19px;
          height: 19px;
        }
        .content {
          padding: 14px 12px 28px;
        }
        .grid {
          gap: 10px;
        }
        .card-body {
          padding: 10px 10px 12px;
        }
        .chips {
          gap: 4px;
        }
        .page-btn {
          padding: 7px 11px;
          min-width: 36px;
        }
        .close {
          width: 34px;
          height: 34px;
        }
      }

      /* ============ Landscape mobile ============ */
      @media (max-height: 500px) and (orientation: landscape) {
        :root {
          --header-h: 56px;
        }
        aside {
          padding: 14px 16px;
        }
        .modal-box {
          max-height: 96vh;
        }
        .modal-poster {
          height: 100%;
          min-height: 220px;
        }
        .modal-info {
          padding: 20px 26px 26px;
        }
        .content {
          padding-top: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle
              cx="12"
              cy="12"
              r="9.5"
              stroke="currentColor"
              stroke-width="1.7"
            />
            <path d="M10 8.3v7.4l6.2-3.7-6.2-3.7z" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-accent">Media&nbsp;Shelf</span>
      </div>
      <div class="search">
        <span class="search-icon" aria-hidden="true">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </span>
        <input
          id="searchInput"
          type="search"
          placeholder="Search titles, tags, keywords, genres..."
          aria-label="Search media library"
        />
      </div>
      <div class="count" id="count" aria-live="polite"></div>
    </header>

    <main>
      <aside>
        <button
          type="button"
          id="filterToggle"
          class="filter-toggle"
          aria-expanded="false"
          aria-controls="filterPanelBody"
        >
          <span class="filter-toggle-left">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18" />
              <path d="M6 12h12" />
              <path d="M10 18h4" />
            </svg>
            Filters
            <span id="filterBadge" class="filter-badge"></span>
          </span>
          <span class="filter-toggle-chevron" aria-hidden="true">
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </span>
        </button>

        <div id="filterPanelBody">
          <div class="filter-group">
            <div class="filter-title">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="3" width="7" height="7" rx="1.5" />
                <rect x="14" y="3" width="7" height="7" rx="1.5" />
                <rect x="14" y="14" width="7" height="7" rx="1.5" />
                <rect x="3" y="14" width="7" height="7" rx="1.5" />
              </svg>
              Category
            </div>
            <div class="select-wrap">
              <select id="categoryFilter" aria-label="Filter by category">
                <option value="">All categories</option>
              </select>
            </div>
          </div>
          <div class="filter-group">
            <div class="filter-title">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.29-8.29a1 1 0 0 0 0-1.41L12 2z"
                />
                <circle cx="7" cy="7" r="1.4" fill="currentColor" stroke="none" />
              </svg>
              Genre
            </div>
            <div class="select-wrap">
              <select id="genreFilter" aria-label="Filter by genre">
                <option value="">All genres</option>
              </select>
            </div>
          </div>
          <div class="filter-group">
            <div class="filter-title">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <line x1="4" y1="9" x2="20" y2="9" />
                <line x1="4" y1="15" x2="20" y2="15" />
                <line x1="10" y1="3" x2="8" y2="21" />
                <line x1="16" y1="3" x2="14" y2="21" />
              </svg>
              Tags
            </div>
            <div id="tagCloud" class="tag-cloud" role="group" aria-label="Filter by tag"></div>
          </div>
          <button id="clearBtn" class="clear">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18" />
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            </svg>
            Clear all filters
          </button>
        </div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <h1>Media Library</h1>
          <div class="select-wrap sort-wrap">
            <select id="sortSelect" aria-label="Sort media">
              <option value="title">Title A–Z</option>
              <option value="titleDesc">Title Z–A</option>
            </select>
          </div>
        </div>
        <div id="grid" class="grid"></div>
        <div id="pagination" class="pagination" role="navigation" aria-label="Pagination"></div>
        <div id="empty" class="empty" style="display: none">
          <div class="empty-icon" aria-hidden="true">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
              <line x1="8" y1="8" x2="14" y2="14" />
              <line x1="14" y1="8" x2="8" y2="14" />
            </svg>
          </div>
          <strong>No media found</strong>
          <span>Try another search or clear the filters.</span>
        </div>
      </section>
    </main>

    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeModal" aria-label="Close details">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
      <div class="modal-box" id="modalBox"></div>
    </div>

    <script src="meta-data-2.js"></script>
    <script>
      const ICONS = {
        eye: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>',
        director:
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>',
        genres:
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.29-8.29a1 1 0 0 0 0-1.41L12 2z"/><circle cx="7" cy="7" r="1.4" fill="currentColor" stroke="none"/></svg>',
        cast: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        tags: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>',
        keywords:
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>',
        file: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>',
      };

      const state = {
        search: "",
        category: "",
        genre: "",
        tag: "",
        sort: "title",
        page: 1,
        pageSize: 99,
      };
      const $ = (id) => document.getElementById(id);
      const norm = (v) =>
        String(v ?? "")
          .toLowerCase()
          .trim();
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );

      function unique(a) {
        return [...new Set(a.filter(Boolean))].sort((a, b) =>
          String(a).localeCompare(String(b)),
        );
      }

      function populateFilters() {
        unique(mediaData.map((x) => x.category)).forEach((v) =>
          $("categoryFilter").insertAdjacentHTML(
            "beforeend",
            `<option value="${esc(v)}">${esc(v)}</option>`,
          ),
        );
        unique(mediaData.flatMap((x) => x.genres || [])).forEach((v) =>
          $("genreFilter").insertAdjacentHTML(
            "beforeend",
            `<option value="${esc(v)}">${esc(v)}</option>`,
          ),
        );
        $("tagCloud").innerHTML = unique(mediaData.flatMap((x) => x.tags || []))
          .map(
            (v) =>
              `<button class="tag-btn" data-tag="${esc(v)}" aria-pressed="false">${esc(v)}</button>`,
          )
          .join("");
      }
      function searchable(x) {
        return [
          x.title,
          x.description,
          x.category,
          ...(x.tags || []),
          ...(x.keywords || []),
          ...(x.genres || []),
          ...(x.cast || []),
          x.director,
        ]
          .join(" ")
          .toLowerCase();
      }
      function filtered() {
        let r = mediaData.filter((x) => {
          const q = norm(state.search);
          return (
            (!q || searchable(x).includes(q)) &&
            (!state.category || norm(x.category) === norm(state.category)) &&
            (!state.genre ||
              (x.genres || []).some((g) => norm(g) === norm(state.genre))) &&
            (!state.tag ||
              (x.tags || []).some((t) => norm(t) === norm(state.tag)))
          );
        });
        r.sort((a, b) => {
          let c = a.title.localeCompare(b.title);
          return state.sort === "titleDesc" ? -c : c;
        });
        return r;
      }
      function totalPages() {
        return Math.max(1, Math.ceil(filtered().length / state.pageSize));
      }
      function goToPage(p) {
        state.page = Math.min(Math.max(1, p), totalPages());
        render();
      }
      function setPage1() {
        state.page = 1;
        render();
      }
      function activeFilterCount() {
        let n = 0;
        if (state.category) n++;
        if (state.genre) n++;
        if (state.tag) n++;
        return n;
      }
      function updateFilterToggleBadge() {
        const badge = $("filterBadge");
        if (!badge) return;
        const n = activeFilterCount();
        badge.textContent = n ? String(n) : "";
        badge.style.display = n ? "inline-flex" : "none";
      }
      function render() {
        const all = filtered();
        const total = all.length;
        const totalP = totalPages();
        if (state.page > totalP) state.page = totalP;
        const start = (state.page - 1) * state.pageSize;
        const pageItems = all.slice(start, start + state.pageSize);
        $("count").textContent = `${total} of ${mediaData.length}`;
        $("grid").innerHTML = pageItems.map((x) => card(x)).join("");
        $("empty").style.display = total ? "none" : "block";
        document.querySelectorAll(".card").forEach((c) => {
          c.onclick = () => openModal(mediaData[+c.dataset.index]);
          c.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openModal(mediaData[+c.dataset.index]);
            }
          };
        });
        document.querySelectorAll(".poster img").forEach((img) => {
          const done = () => img.classList.add("loaded");
          if (img.complete) done();
          else img.addEventListener("load", done, { once: true });
        });
        renderPagination(totalP);
        updateFilterToggleBadge();
      }
      function renderPagination(totalP) {
        const container = $("pagination");
        if (totalP <= 1) {
          container.innerHTML = "";
          return;
        }
        let html = `<button class="page-btn" ${state.page === 1 ? "disabled" : ""} onclick="goToPage(${state.page - 1})" aria-label="Previous page">‹ Prev</button>`;
        for (let i = 1; i <= totalP; i++) {
          html += `<button class="page-btn ${i === state.page ? "active" : ""}" onclick="goToPage(${i})" aria-label="Go to page ${i}" ${i === state.page ? 'aria-current="page"' : ""}>${i}</button>`;
        }
        html += `<button class="page-btn" ${state.page === totalP ? "disabled" : ""} onclick="goToPage(${state.page + 1})" aria-label="Next page">Next ›</button>`;
        html += `<span class="page-info">Page ${state.page} of ${totalP}</span>`;
        container.innerHTML = html;
      }
      function toFileUrl(p) {
        if (!p) return "";
        return "file:///" + p.replace(/\\/g, "/");
      }
      function card(x) {
        const i = mediaData.indexOf(x);
        let thumb = "";
        if (x.posterImage?.assetPath) {
          thumb = x.posterImage.assetPath;
        } else if (x.posterImage?.absolutePath) {
          thumb = toFileUrl(x.posterImage.absolutePath);
        } else if (x.posterImage?.thumbnailFileName) {
          thumb = "Assets/thumbnails/" + x.posterImage.thumbnailFileName;
        }
        return `<article class="card" data-index="${i}" tabindex="0" role="button" aria-label="View details for ${esc(x.title)}"><div class="poster${thumb ? " has-image" : ""}">${thumb ? `<img src="${esc(thumb)}" alt="${esc(x.title)} poster" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="placeholder" style="display:none">Image not found<br>${esc(thumb)}</div>` : `<div class="placeholder">No poster image</div>`}<div class="poster-overlay"><span class="poster-view">${ICONS.eye} View details</span></div></div><div class="card-body"><div class="title">${esc(x.title)}</div><div class="meta">${x.category ? `<span class="meta-dot"></span>${esc(x.category)}` : ""}</div><div class="chips">${(
          x.genres || []
        )
          .slice(0, 3)
          .map((g) => `<span class="chip">${esc(g)}</span>`)
          .join("")}</div></div></article>`;
      }
      let lastFocusedElement = null;
      let modalHistoryPushed = false;

      function lockScroll() {
        const scrollBarWidth =
          window.innerWidth - document.documentElement.clientWidth;
        document.body.style.overflow = "hidden";
        if (scrollBarWidth > 0)
          document.body.style.paddingRight = `${scrollBarWidth}px`;
      }

      function unlockScroll() {
        document.body.style.overflow = "";
        document.body.style.paddingRight = "";
      }

      function closeModal(fromPopState) {
        $("modal").classList.remove("open");
        unlockScroll();
        document.removeEventListener("keydown", trapFocus);
        if (lastFocusedElement && document.contains(lastFocusedElement))
          lastFocusedElement.focus();
        if (modalHistoryPushed) {
          modalHistoryPushed = false;
          if (!fromPopState) history.back();
        }
      }

      function trapFocus(e) {
        if (e.key === "Escape") {
          closeModal();
          return;
        }
        if (e.key !== "Tab") return;
        const focusable = $("modal").querySelectorAll(
          'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        );
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }

      function openModal(x) {
        lastFocusedElement = document.activeElement;
        let f = "";
        if (x.posterImage?.assetPath) {
          f = x.posterImage.assetPath;
        } else if (x.posterImage?.absolutePath) {
          f = toFileUrl(x.posterImage.absolutePath);
        } else if (x.posterImage?.thumbnailFileName) {
          f = "Assets/thumbnails/" + x.posterImage.thumbnailFileName;
        }
        $("modalBox").innerHTML =
          `<div class="modal-poster${f ? " has-image" : ""}">${f ? `<img src="${esc(f)}" alt="${esc(x.title)} poster" decoding="async" onerror="this.style.display='none'">` : ""}</div><div class="modal-info"><h2 id="modalTitle">${esc(x.title)}</h2><div class="meta">${x.category ? `<span class="meta-dot"></span>${esc(x.category)}` : ""}</div>${x.director ? `<div class="detail-section"><div class="detail-label">${ICONS.director} Director</div><div class="detail-chips"><button class="detail-chip director-chip" data-director="${esc(x.director)}">${esc(x.director)}</button></div></div>` : ""}<div class="detail-section"><div class="detail-label">Description</div><div class="modal-description">${esc(x.description || "No description available.")}</div></div><div class="detail-section"><div class="detail-label">${ICONS.genres} Genres</div><div class="detail-chips">${(x.genres || []).map((v) => `<button class="detail-chip genre-chip" data-genre="${esc(v)}">${esc(v)}</button>`).join("")}</div></div><div class="detail-section"><div class="detail-label">${ICONS.cast} Cast</div><div class="detail-chips">${(x.cast || []).map((v) => `<button class="detail-chip cast-chip" data-cast="${esc(v)}">${esc(v)}</button>`).join("")}</div></div><div class="detail-section"><div class="detail-label">${ICONS.tags} Tags</div><div class="detail-chips">${(x.tags || []).map((v) => `<button class="detail-chip tag-chip" data-tag="${esc(v)}">${esc(v)}</button>`).join("")}</div></div><div class="detail-section"><div class="detail-label">${ICONS.keywords} Keywords</div><div class="detail-chips">${(x.keywords || []).map((v) => `<button class="detail-chip keyword-chip" data-keyword="${esc(v)}">${esc(v)}</button>`).join("")}</div></div><div class="detail-section"><div class="detail-label">${ICONS.file} Poster file</div><div class="filename">${esc(f || "Not specified")}</div></div></div>`;
        $("modal").classList.add("open");
        if (!modalHistoryPushed) {
          modalHistoryPushed = true;
          history.pushState({ mediaModal: true }, "", location.href);
        }
        const modalImg = $("modalBox").querySelector(".modal-poster img");
        if (modalImg) {
          const done = () => modalImg.classList.add("loaded");
          if (modalImg.complete) done();
          else modalImg.addEventListener("load", done, { once: true });
        }
        lockScroll();
        document.addEventListener("keydown", trapFocus);
        $("closeModal").focus();
      }
      $("searchInput").oninput = (e) => {
        state.search = e.target.value;
        setPage1();
      };
      $("categoryFilter").onchange = (e) => {
        state.category = e.target.value;
        setPage1();
      };
      $("genreFilter").onchange = (e) => {
        state.genre = e.target.value;
        setPage1();
      };
      $("sortSelect").onchange = (e) => {
        state.sort = e.target.value;
        setPage1();
      };
      $("tagCloud").onclick = (e) => {
        const b = e.target.closest(".tag-btn");
        if (!b) return;
        state.tag = state.tag === b.dataset.tag ? "" : b.dataset.tag;
        document.querySelectorAll(".tag-btn").forEach((x) => {
          const isActive = x.dataset.tag === state.tag;
          x.classList.toggle("active", isActive);
          x.setAttribute("aria-pressed", String(isActive));
        });
        setPage1();
      };
      $("clearBtn").onclick = () => {
        Object.assign(state, { search: "", category: "", genre: "", tag: "" });
        $("searchInput").value = "";
        $("categoryFilter").value = "";
        $("genreFilter").value = "";
        document.querySelectorAll(".tag-btn").forEach((x) => {
          x.classList.remove("active");
          x.setAttribute("aria-pressed", "false");
        });
        setPage1();
      };
      $("closeModal").onclick = () => closeModal();
      $("modal").onclick = (e) => {
        if (e.target === $("modal")) closeModal();
      };
      $("modalBox").addEventListener("click", (e) => {
        const castButton = e.target.closest(".cast-chip");
        const genreButton = e.target.closest(".genre-chip");
        const tagButton = e.target.closest(".tag-chip");
        const keywordButton = e.target.closest(".keyword-chip");
        const directorButton = e.target.closest(".director-chip");
        if (castButton) {
          const castName = castButton.dataset.cast;
          state.search = castName;
          state.category = "";
          state.genre = "";
          state.tag = "";
          $("searchInput").value = castName;
          $("categoryFilter").value = "";
          $("genreFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) => x.classList.remove("active"));
          closeModal();
          setPage1();
        } else if (genreButton) {
          const genreName = genreButton.dataset.genre;
          state.genre = genreName;
          state.search = "";
          state.category = "";
          state.tag = "";
          $("genreFilter").value = genreName;
          $("searchInput").value = "";
          $("categoryFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) => x.classList.remove("active"));
          closeModal();
          setPage1();
        } else if (tagButton) {
          const tagName = tagButton.dataset.tag;
          state.tag = state.tag === tagName ? "" : tagName;
          state.search = "";
          state.category = "";
          state.genre = "";
          $("searchInput").value = "";
          $("categoryFilter").value = "";
          $("genreFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) =>
              x.classList.toggle("active", x.dataset.tag === state.tag),
            );
          closeModal();
          setPage1();
        } else if (keywordButton) {
          const keywordName = keywordButton.dataset.keyword;
          state.search = keywordName;
          state.category = "";
          state.genre = "";
          state.tag = "";
          $("searchInput").value = keywordName;
          $("categoryFilter").value = "";
          $("genreFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) => x.classList.remove("active"));
          closeModal();
          setPage1();
        } else if (directorButton) {
          const directorName = directorButton.dataset.director;
          state.search = directorName;
          state.category = "";
          state.genre = "";
          state.tag = "";
          $("searchInput").value = directorName;
          $("categoryFilter").value = "";
          $("genreFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) => x.classList.remove("active"));
          closeModal();
          setPage1();
        }
      });

      window.addEventListener("popstate", () => {
        if ($("modal").classList.contains("open")) {
          closeModal(true);
        }
      });

      const filterToggleBtn = $("filterToggle");
      const filterPanelBody = $("filterPanelBody");
      if (filterToggleBtn && filterPanelBody) {
        filterToggleBtn.addEventListener("click", () => {
          const isOpen = filterPanelBody.classList.toggle("open");
          filterToggleBtn.classList.toggle("open", isOpen);
          filterToggleBtn.setAttribute("aria-expanded", String(isOpen));
        });
      }

      populateFilters();
      render();
    </script>
  </body>
</html>
