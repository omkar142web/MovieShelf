<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Media Hub</title>
    <style>
      :root {
        --bg-main: #0b0d10;
        --bg-sidebar: #0e1115;
        --bg-card: #12161b;
        --bg-chip: #20252c;
        --bg-hover: #211b3b;

        --border-main: #28303a;
        --border-chip: #303740;
        --border-hover: #454d58;
        --accent: #7c5cff;

        --text-main: #f3f5f7;
        --text-white: #fff;
        --text-secondary: #929aa5;
        --text-muted: #b5bcc5;
        --text-chip: #c7cbd1;
        --text-tag: #cdd2d8;

        --overlay: #000000b8;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg-main);
        color: var(--text-main);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      header {
        height: 72px;
        border-bottom: 1px solid var(--border-main);
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 28px;
        position: sticky;
        top: 0;
        background: #0b0d10f2;
        backdrop-filter: blur(12px);
        z-index: 10;
      }
      .brand {
        font-size: 20px;
        font-weight: 800;
        white-space: nowrap;
      }
      .brand span {
        color: #9b86ff;
      }
      .search {
        flex: 1;
        max-width: 650px;
        position: relative;
      }
      .search input {
        width: 100%;
        height: 42px;
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        border-radius: 10px;
        color: var(--text-white);
        padding: 0 15px 0 42px;
        outline: none;
      }
      .search input:focus {
        border-color: var(--accent);
      }
      .search-icon {
        position: absolute;
        left: 15px;
        top: 9px;
        color: var(--text-secondary);
      }
      .count {
        color: var(--text-secondary);
        font-size: 13px;
        white-space: nowrap;
      }
      main {
        display: grid;
        grid-template-columns: 250px 1fr;
        min-height: calc(100vh - 72px);
      }
      aside {
        border-right: 1px solid var(--border-main);
        padding: 22px 18px;
        background: var(--bg-sidebar);
      }
      .filter-group {
        margin-bottom: 25px;
      }
      .filter-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
        margin-bottom: 11px;
      }
      select {
        width: 100%;
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        border-radius: 8px;
        color: var(--text-white);
        padding: 10px;
        outline: none;
      }
      .tag-cloud {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .tag-btn {
        border: 1px solid var(--border-main);
        background: var(--bg-card);
        color: var(--text-tag);
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 12px;
        cursor: pointer;
      }
      .tag-btn:hover,
      .tag-btn.active {
        border-color: var(--accent);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .clear {
        width: 100%;
        border: 1px solid var(--border-main);
        background: transparent;
        color: var(--text-secondary);
        border-radius: 8px;
        padding: 9px;
        cursor: pointer;
      }
      .clear:hover {
        color: var(--text-white);
      }
      .content {
        padding: 25px 28px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 22px;
      }
      .toolbar h1 {
        font-size: 24px;
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 20px;
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.18s;
      }
      .card:hover {
        transform: translateY(-3px);
        border-color: var(--border-hover);
      }
      .poster {
        width: 100%;
        aspect-ratio: 2/3;
        background: #1a1f25;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #66707c;
        overflow: hidden;
      }
      .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .placeholder {
        font-size: 12px;
        padding: 20px;
        text-align: center;
      }
      .card-body {
        padding: 13px;
      }
      .title {
        font-weight: 750;
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        color: var(--text-secondary);
        font-size: 12px;
        margin-top: 5px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 10px;
      }
      .chip {
        font-size: 10px;
        color: var(--text-chip);
        background: var(--bg-chip);
        border-radius: 999px;
        padding: 4px 7px;
      }
      .empty {
        padding: 70px 20px;
        text-align: center;
        color: var(--text-secondary);
      }
      .empty strong {
        display: block;
        color: var(--text-white);
        font-size: 18px;
        margin-bottom: 7px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: var(--overlay);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 25px;
        z-index: 20;
      }
      .modal.open {
        display: flex;
      }
      .modal-box {
        width: min(900px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        border-radius: 16px;
        display: grid;
        grid-template-columns: 280px 1fr;
      }
      .modal-poster {
        background: var(--bg-main);
        min-height: 420px;
      }
      .modal-poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .modal-info {
        padding: 28px;
      }
      .modal-info h2 {
        margin: 0 35px 8px 0;
        font-size: 30px;
      }
      .modal-description {
        color: var(--text-muted);
        line-height: 1.6;
      }
      .close {
        position: fixed;
        right: 25px;
        top: 20px;
        border: 0;
        background: #252a31;
        color: var(--text-white);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
      }
      .detail-section {
        margin-top: 22px;
      }
      .detail-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
        margin-bottom: 9px;
      }
      .detail-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .detail-chip {
        color: var(--text-chip);
        background: var(--bg-chip);
        border: 1px solid var(--border-chip);
        padding: 6px 9px;
        border-radius: 999px;
        font-size: 12px;
        cursor: pointer;
      }
      .cast-chip:hover {
        border-color: var(--accent);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .genre-chip:hover {
        border-color: var(--accent);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .tag-chip:hover {
        border-color: var(--accent);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .keyword-chip:hover {
        border-color: var(--accent);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .director-chip:hover {
        border-color: var(--accent);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .filename {
        font-family: ui-monospace, monospace;
        color: var(--text-chip);
        background: var(--bg-sidebar);
        border: 1px solid var(--border-main);
        padding: 9px;
        border-radius: 7px;
        word-break: break-all;
      }
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 25px;
        flex-wrap: wrap;
      }
      .page-btn {
        border: 1px solid var(--border-main);
        background: var(--bg-card);
        color: var(--text-tag);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
        min-width: 40px;
        text-align: center;
      }
      .page-btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .page-btn.active {
        border-color: var(--accent);
        color: var(--text-white);
        background: var(--bg-hover);
      }
      .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .page-info {
        color: var(--text-secondary);
        font-size: 13px;
        white-space: nowrap;
      }
      @media (max-width: 800px) {
        header {
          padding: 0 15px;
        }
        .count {
          display: none;
        }
        main {
          grid-template-columns: 1fr;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid var(--border-main);
        }
        .filter-group {
          display: inline-block;
          width: 48%;
          vertical-align: top;
          margin-right: 1%;
        }
        .grid {
          grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        }
        .content {
          padding: 18px;
        }
        .modal-box {
          grid-template-columns: 1fr;
        }
        .modal-poster {
          height: 350px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">AI <span>Media Hub</span></div>
      <div class="search">
        <span class="search-icon">⌕</span
        ><input
          id="searchInput"
          type="search"
          placeholder="Search titles, tags, keywords, genres..."
        />
      </div>
      <div class="count" id="count"></div>
    </header>

    <main>
      <aside>
        <div class="filter-group">
          <div class="filter-title">Category</div>
          <select id="categoryFilter">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="filter-group">
          <div class="filter-title">Genre</div>
          <select id="genreFilter">
            <option value="">All genres</option>
          </select>
        </div>
        <div class="filter-group">
          <div class="filter-title">Tags</div>
          <div id="tagCloud" class="tag-cloud"></div>
        </div>
        <button id="clearBtn" class="clear">Clear all filters</button>
      </aside>

      <section class="content">
        <div class="toolbar">
          <h1>Media Library</h1>
          <select id="sortSelect" style="width: auto">
            <option value="title">Title A–Z</option>
            <option value="titleDesc">Title Z–A</option>
          </select>
        </div>
        <div id="grid" class="grid"></div>
        <div id="pagination" class="pagination"></div>
        <div id="empty" class="empty" style="display: none">
          <strong>No media found</strong>Try another search or clear the
          filters.
        </div>
      </section>
    </main>

    <div id="modal" class="modal">
      <button class="close" id="closeModal">×</button>
      <div class="modal-box" id="modalBox"></div>
    </div>

    <script>
      const mediaData = [];

      async function loadData() {
        try {
          const res = await fetch('meta-data-2.json');
          const data = await res.json();
          mediaData.push(...data);
        } catch (err) {
          console.error('Failed to load meta-data-2.json', err);
        }
        populateFilters();
        render();
      }

      loadData();

      const state = {
        search: "",
        category: "",
        genre: "",
        tag: "",
        sort: "title",
        page: 1,
        pageSize: 8,
      };
      const $ = (id) => document.getElementById(id);
      const norm = (v) =>
        String(v ?? "")
          .toLowerCase()
          .trim();
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );

      function unique(a) {
        return [...new Set(a.filter(Boolean))].sort((a, b) =>
          String(a).localeCompare(String(b)),
        );
      }

      function populateFilters() {
        unique(mediaData.map((x) => x.category)).forEach((v) =>
          $("categoryFilter").insertAdjacentHTML(
            "beforeend",
            `<option value="${esc(v)}">${esc(v)}</option>`,
          ),
        );
        unique(mediaData.flatMap((x) => x.genres || [])).forEach((v) =>
          $("genreFilter").insertAdjacentHTML(
            "beforeend",
            `<option value="${esc(v)}">${esc(v)}</option>`,
          ),
        );
        $("tagCloud").innerHTML = unique(mediaData.flatMap((x) => x.tags || []))
          .map(
            (v) =>
              `<button class="tag-btn" data-tag="${esc(v)}">${esc(v)}</button>`,
          )
          .join("");
      }
      function searchable(x) {
        return [
          x.title,
          x.description,
          x.category,
          ...(x.tags || []),
          ...(x.keywords || []),
          ...(x.genres || []),
          ...(x.cast || []),
          x.director,
        ]
          .join(" ")
          .toLowerCase();
      }
      function filtered() {
        let r = mediaData.filter((x) => {
          const q = norm(state.search);
          return (
            (!q || searchable(x).includes(q)) &&
            (!state.category || norm(x.category) === norm(state.category)) &&
            (!state.genre ||
              (x.genres || []).some((g) => norm(g) === norm(state.genre))) &&
            (!state.tag ||
              (x.tags || []).some((t) => norm(t) === norm(state.tag)))
          );
        });
        r.sort((a, b) => {
          let c = a.title.localeCompare(b.title);
          return state.sort === "titleDesc" ? -c : c;
        });
        return r;
      }
      function totalPages() {
        return Math.max(1, Math.ceil(filtered().length / state.pageSize));
      }
      function goToPage(p) {
        state.page = Math.min(Math.max(1, p), totalPages());
        render();
      }
      function setPage1() {
        state.page = 1;
        render();
      }
      function render() {
        const all = filtered();
        const total = all.length;
        const totalP = totalPages();
        if (state.page > totalP) state.page = totalP;
        const start = (state.page - 1) * state.pageSize;
        const pageItems = all.slice(start, start + state.pageSize);
        $("count").textContent = `${total} of ${mediaData.length}`;
        $("grid").innerHTML = pageItems.map((x) => card(x)).join("");
        $("empty").style.display = total ? "none" : "block";
        document
          .querySelectorAll(".card")
          .forEach(
            (c) => (c.onclick = () => openModal(mediaData[+c.dataset.index])),
          );
        renderPagination(totalP);
      }
      function renderPagination(totalP) {
        const container = $("pagination");
        if (totalP <= 1) {
          container.innerHTML = "";
          return;
        }
        let html = `<button class="page-btn" ${state.page === 1 ? 'disabled' : ''} onclick="goToPage(${state.page - 1})">Prev</button>`;
        for (let i = 1; i <= totalP; i++) {
          html += `<button class="page-btn ${i === state.page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        }
        html += `<button class="page-btn" ${state.page === totalP ? 'disabled' : ''} onclick="goToPage(${state.page + 1})">Next</button>`;
        html += `<span class="page-info">Page ${state.page} of ${totalP}</span>`;
        container.innerHTML = html;
      }
      function card(x) {
        const i = mediaData.indexOf(x);
        const thumb = x.posterImage?.thumbnailFileName
          ? "Assets/thumbnails/" + x.posterImage.thumbnailFileName
          : x.posterImage?.fileName
            ? "Assets/" + x.posterImage.fileName
            : "";
        return `<article class="card" data-index="${i}"><div class="poster">${thumb ? `<img src="${esc(thumb)}" alt="${esc(x.title)} poster" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="placeholder" style="display:none">Image not found<br>${esc(thumb)}</div>` : `<div class="placeholder">No poster image</div>`}</div><div class="card-body"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.category || "")}</div><div class="chips">${(
          x.genres || []
        )
          .slice(0, 3)
          .map((g) => `<span class="chip">${esc(g)}</span>`)
          .join("")}</div></div></article>`;
      }
      function openModal(x) {
        const f = x.posterImage?.fileName ? "Assets/" + x.posterImage.fileName : "";
        $("modalBox").innerHTML =
          `<div class="modal-poster">${f ? `<img src="${esc(f)}" alt="${esc(x.title)} poster" onerror="this.style.display='none'">` : ""}</div><div class="modal-info"><h2>${esc(x.title)}</h2><div class="meta">${esc(x.category || "")}</div>${x.director ? `<div class="detail-section"><div class="detail-label">Director</div><div class="detail-chips"><button class="detail-chip director-chip" data-director="${esc(x.director)}">${esc(x.director)}</button></div></div>` : ""}<div class="detail-section"><div class="detail-label">Description</div><div class="modal-description">${esc(x.description || "No description available.")}</div></div><div class="detail-section"><div class="detail-label">Genres</div><div class="detail-chips">${(x.genres || []).map((v) => `<button class="detail-chip genre-chip" data-genre="${esc(v)}">${esc(v)}</button>`).join("")}</div></div><div class="detail-section"><div class="detail-label">Cast</div><div class="detail-chips">${(x.cast || []).map((v) => `<button class="detail-chip cast-chip" data-cast="${esc(v)}">${esc(v)}</button>`).join("")}</div></div><div class="detail-section"><div class="detail-label">Tags</div><div class="detail-chips">${(x.tags || []).map((v) => `<button class="detail-chip tag-chip" data-tag="${esc(v)}">${esc(v)}</button>`).join("")}</div></div><div class="detail-section"><div class="detail-label">Keywords</div><div class="detail-chips">${(x.keywords || []).map((v) => `<button class="detail-chip keyword-chip" data-keyword="${esc(v)}">${esc(v)}</button>`).join("")}</div></div><div class="detail-section"><div class="detail-label">Poster file</div><div class="filename">${esc(f || "Not specified")}</div></div></div>`;
        $("modal").classList.add("open");
      }
      $("searchInput").oninput = (e) => {
        state.search = e.target.value;
        setPage1();
      };
      $("categoryFilter").onchange = (e) => {
        state.category = e.target.value;
        setPage1();
      };
      $("genreFilter").onchange = (e) => {
        state.genre = e.target.value;
        setPage1();
      };
      $("sortSelect").onchange = (e) => {
        state.sort = e.target.value;
        setPage1();
      };
      $("tagCloud").onclick = (e) => {
        const b = e.target.closest(".tag-btn");
        if (!b) return;
        state.tag = state.tag === b.dataset.tag ? "" : b.dataset.tag;
        document
          .querySelectorAll(".tag-btn")
          .forEach((x) =>
            x.classList.toggle("active", x.dataset.tag === state.tag),
          );
        setPage1();
      };
      $("clearBtn").onclick = () => {
        Object.assign(state, { search: "", category: "", genre: "", tag: "" });
        $("searchInput").value = "";
        $("categoryFilter").value = "";
        $("genreFilter").value = "";
        document
          .querySelectorAll(".tag-btn")
          .forEach((x) => x.classList.remove("active"));
        setPage1();
      };
      $("closeModal").onclick = () => $("modal").classList.remove("open");
      $("modal").onclick = (e) => {
        if (e.target === $("modal")) $("modal").classList.remove("open");
      };
      $("modalBox").addEventListener("click", (e) => {
        const castButton = e.target.closest(".cast-chip");
        const genreButton = e.target.closest(".genre-chip");
        const tagButton = e.target.closest(".tag-chip");
        const keywordButton = e.target.closest(".keyword-chip");
        const directorButton = e.target.closest(".director-chip");
        if (castButton) {
          const castName = castButton.dataset.cast;
          state.search = castName;
          state.category = "";
          state.genre = "";
          state.tag = "";
          $("searchInput").value = castName;
          $("categoryFilter").value = "";
          $("genreFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) => x.classList.remove("active"));
          $("modal").classList.remove("open");
          setPage1();
        } else if (genreButton) {
          const genreName = genreButton.dataset.genre;
          state.genre = genreName;
          state.search = "";
          state.category = "";
          state.tag = "";
          $("genreFilter").value = genreName;
          $("searchInput").value = "";
          $("categoryFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) => x.classList.remove("active"));
          $("modal").classList.remove("open");
          setPage1();
        } else if (tagButton) {
          const tagName = tagButton.dataset.tag;
          state.tag = state.tag === tagName ? "" : tagName;
          state.search = "";
          state.category = "";
          state.genre = "";
          $("searchInput").value = "";
          $("categoryFilter").value = "";
          $("genreFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) =>
              x.classList.toggle("active", x.dataset.tag === state.tag),
            );
          $("modal").classList.remove("open");
          setPage1();
        } else if (keywordButton) {
          const keywordName = keywordButton.dataset.keyword;
          state.search = keywordName;
          state.category = "";
          state.genre = "";
          state.tag = "";
          $("searchInput").value = keywordName;
          $("categoryFilter").value = "";
          $("genreFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) => x.classList.remove("active"));
          $("modal").classList.remove("open");
          setPage1();
        } else if (directorButton) {
          const directorName = directorButton.dataset.director;
          state.search = directorName;
          state.category = "";
          state.genre = "";
          state.tag = "";
          $("searchInput").value = directorName;
          $("categoryFilter").value = "";
          $("genreFilter").value = "";
          document
            .querySelectorAll(".tag-btn")
            .forEach((x) => x.classList.remove("active"));
          $("modal").classList.remove("open");
          setPage1();
        }
      });
      document.onkeydown = (e) => {
        if (e.key === "Escape") $("modal").classList.remove("open");
      };
      populateFilters();
      render();
    </script>
  </body>
</html>
